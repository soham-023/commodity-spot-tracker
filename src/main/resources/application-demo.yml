# Offline demo: in-memory database, live sources and the scheduler off, data loaded from
# src/main/resources/demo at startup. Run with: mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  datasource:
    url: jdbc:h2:mem:demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1

spot:
  ingest:
    scheduler-enabled: false
  sources:
    ncdex:
      enabled: false
    ncdex-product:
      enabled: false
    agmarknet:
      enabled: false
