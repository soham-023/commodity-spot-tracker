spring:
  application:
    name: commodity-spot-tracker
  datasource:
    url: ${SPOT_DB_URL:jdbc:h2:file:./data/spottracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPOT_DB_USER:sa}
    password: ${SPOT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

spot:
  ingest:
    scheduler-enabled: ${SPOT_SCHEDULER_ENABLED:true}
    cron: ${SPOT_INGEST_CRON:0 30 18 * * *}
    zone: Asia/Kolkata
  spread:
    threshold-pct: ${SPOT_SPREAD_THRESHOLD_PCT:5}
    day-move-pct: ${SPOT_DAY_MOVE_PCT:3}
    benchmark-market: Nizamabad
    benchmark-variety: Farmer Polished
    max-spot-age-days: 7
  contracts:
    # Near month rolls to the next expiry this many calendar days before expiry
    roll-days: ${SPOT_ROLL_DAYS:5}
    # Alert when near-month total margin (% of contract value) moves more than this many points day over day
    margin-alert-points: ${SPOT_MARGIN_ALERT_POINTS:2}
  alerts:
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-chat-id: ${TELEGRAM_CHAT_ID:}
    webhook-url: ${ALERT_WEBHOOK_URL:}
  sources:
    ncdex:
      enabled: ${SPOT_NCDEX_ENABLED:true}
      base-url: ${SPOT_NCDEX_BASE_URL:https://www.ncdex.com}
      futures-symbol: TMCFGRNZM
      basis-centre: Nizamabad
      spot-names:
        - Turmeric (Farmer Polished)
        - Turmeric (Unpolished)
        - Turmeric (Rajapore)
      timeout: 30s
    ncdex-product:
      # Contract calendar, daily margins and premium/discount matrix from <base-url>/products/<futures-symbol>
      enabled: ${SPOT_NCDEX_PRODUCT_ENABLED:true}
      timeout: 30s
    agmarknet:
      enabled: ${SPOT_AGMARKNET_ENABLED:true}
      # Free key from https://data.gov.in (My Account > Generate API key). Never commit it.
      api-key: ${DATA_GOV_API_KEY:}
      base-url: https://api.data.gov.in
      resource-id: 9ef84268-d588-465a-a308-a864a43d0070
      commodity: Turmeric
      page-size: ${DATA_GOV_PAGE_SIZE:1000}
      markets: ${SPOT_MANDI_MARKETS:Nizamabad,Sangli,Erode,Hingoli,Basmat,Warangal}
      timeout: 30s
